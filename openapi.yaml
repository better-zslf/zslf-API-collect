openapi: 3.0.3
info:
  title: 掌上莲峰（zslf）API
  version: 1.0.0
  description: "# 掌上莲峰（zslf）API 文档\n\n电子科技大学中山学院「掌上莲峰」App 的完整 HTTP API 集合。\n\n> **本文档的所有结论均经过对生产后端的真实请求验证**，不是纯静态推断。\n\
    > 采集对象：`zslf.apk`（sha256 `416b4524321d6ab1dc6884b230b4fffd87fbf594143f99345abf2f815253fc92`，\n> 版本\
    \ `1.0.83` / `10089`，包名 `com.zx.slm`）。\n\n---\n\n## \U0001F4CA 覆盖情况\n\n| 指标 | 数值 |\n|---|---|\n| 收录接口\
    \ | **89** 个 path / method |\n| 已实测验证 | **87** 个（97.8%） |\n| 未实测 | 2 个（`/member/user/*`，预留死接口，全包零调用点）\
    \ |\n| 接口分组 | **25** 个 |\n\n---\n\n## \U0001F680 快速上手\n\n### 第 1 步：登录拿 token\n\n```http\nPOST https://zslf.zsc.edu.cn/app/login?username=<学号>&password=<口令>\n\
    ```\n\n响应 `data.accessToken` 就是 token（**UUID v4 格式**）。\n\n### 第 2 步：带上 token 调其它接口\n\n```http\nGET\
    \ https://zslf.zsc.edu.cn/app/appUser/getUserInfo\nAuthorization: <accessToken>\n```\n\n就这一个头。**不用加\
    \ `Bearer ` 前缀**，服务端只认裸值。\n\n### 完整示例（curl）\n\n```bash\n# 1. 登录\ncurl -X POST 'https://zslf.zsc.edu.cn/app/login?username=YOUR_ID&password=YOUR_PASS'\n\
    \n# 2. 用返回的 accessToken 查用户信息\ncurl 'https://zslf.zsc.edu.cn/app/appUser/getUserInfo' \\\n  -H 'Authorization:\
    \ <accessToken>'\n\n# 3. 查未读消息\ncurl -X POST 'https://zslf.zsc.edu.cn/app/appNotice/unreadNumber'\
    \ \\\n  -H 'Authorization: <accessToken>'\n```\n\n---\n\n## \U0001F4D0 通用约定\n\n### Base URL\n\n| 用途\
    \ | Base |\n|---|---|\n| 绝大多数业务接口 | `https://zslf.zsc.edu.cn/app` |\n| **`/run/*` 一组（运动/场馆/体测）** |\
    \ `https://zslf.zsc.edu.cn`（**没有 `/app` 前缀**） |\n\n> 这是最容易踩的坑：`/run/errand/getErrandList` 的完整地址是\n\
    > `https://zslf.zsc.edu.cn/run/errand/getErrandList`，**不是** `/app/run/...`。\n\n### 鉴权\n\n| 项 | 约定\
    \ |\n|---|---|\n| Header | `Authorization: <accessToken>` |\n| 格式 | **裸 token，无 `Bearer ` 前缀** |\n\
    | token 形态 | UUID v4（形如 `xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx`），**不是 JWT** |\n| 服务端校验 | **严格**。5 种无效\
    \ token 实测全部返回 **HTTP 401** |\n| 刷新机制 | **不存在**。登录响应里没有 `refreshToken` 字段，也没有刷新端点；过期只能重新登录 |\n| 请求头宽松度\
    \ | 实测**只需 `Authorization` 一个头**；`Accept` / `platform` / `appVersion` / `Content-Type` 全部可选且不校验值 |\n\
    \n### 参数位置\n\n| 位置 | 适用范围 |\n|---|---|\n| **URL query string** | 绝大多数接口（登录、改密、列表查询…） |\n| **JSON body**\
    \ | 仅 5 个：`/run/errand/{quickSave,syncSportData,reportLocation,addErrandTrackByData}`、`/mobileLogReport/addLog`\
    \ |\n| **multipart/form-data** | 仅上传接口 |\n\n### 响应信封\n\n```json\n{\n  \"code\": 200,\n  \"data\":\
    \ {},\n  \"message\": \"获取用户信息成功\",\n  \"success\": true\n}\n```\n\n| 字段 | 说明 |\n|---|---|\n| `code`\
    \ | **业务状态码**，`200` = 成功 |\n| `data` | 业务数据；**失败时是空字符串 `\"\"`**（不是 `null`） |\n| `message` | 中文提示 |\n\
    | `success` | 与 `code` 语义一致，客户端从不读取 |\n\n### ⚠️ 两层错误处理（必读）\n\n```text\nHTTP 401  →  未登录 / token 失效\
    \          → 跳登录页\nHTTP 200  →  再看 body.code\n              code === 200  →  成功\n              code\
    \ !== 200  →  失败，展示 body.message\n```\n\n**业务错误仍然是 HTTP 200。** 只判 HTTP 状态码会漏掉所有业务错误。\n\n---\n\n##\
    \ \U0001F4DA 接口分组\n\n- **`auth`** — 登录鉴权\n- **`appUser`** — 用户资料、头像、密码\n- **`appNotice`** — 站内通知、未读数\n\
    - **`announcement`** — 校园公告\n- **`appFind`** — 发现页菜单、配置字典\n- **`appCmsColumn`** — CMS 栏目\n- **`appCmsArticle`**\
    \ — CMS 文章、详情、阅读数\n- **`appCmsArticleLike`** — 文章点赞\n- **`adApi`** — 首页轮播图\n- **`business`** — 周边商家与活动\n\
    - **`appRecruit`** — 兼职招聘\n- **`appRecommend`** — 广场帖子 / 兼职推荐\n- **`recycle`** — 二手物品（闲置）\n- **`questionNaire`**\
    \ — 调查问卷\n- **`imChat`** — 在线客服\n- **`AppOperator`** — 校园宽带套餐\n- **`appFeedback`** — 意见反馈\n- **`mobileLogReport`**\
    \ — 客户端日志上报\n- **`run`** — 运动 / 场馆预约 / 体测（**无 `/app` 前缀**）\n- **`sign`** — 签到与积分\n- **`verification`**\
    \ — 校园网认证\n- **`campusNetwork`** — 校园网 / 宽带账号\n- **`upload`** — 文件上传\n- **`version`** — 版本更新\n- **`member`**\
    \ — 新版用户中心（预留，未启用）\n\n---\n\n## \U0001F517 常用调用链\n\n### 校园动态（首页）\n\n```text\nPOST /app/appCmsColumn/getCmsByModule?name=学校动态\n\
    \  → data.cmsColumn.id\nPOST /app/appCmsArticle/getCmsArticleByColumnId?cmsCloumnId=<id>&offset=0&limit=10\n\
    \  → data.cmsArticleList[]\nPOST /app/appCmsArticle/articleDetailsById?articleId=<id>\n  → data.articleDetails.content（HTML\
    \ 正文）\n```\n\n### 签到积分\n\n```text\nPOST /app/sign/getUserSign        近 7 天签到日历\nPOST /app/sign/getSumIntegral\
    \     总积分\nPOST /app/sign/getIntegralDetailByUserId?userId=<uid>   积分明细\n```\n\n### 校园跑\n\n```text\n\
    POST /run/errand/getErrandList?userId=<uid>&offset=0&limit=10&isFinish=0\nPOST /run/errand/getTrackByTrid?trid=<trid>\
    \          轨迹点\nPOST /run/errand/syncSportData                       JSON body，必填 trid\n```\n\n###\
    \ 功能配置\n\n```text\nPOST /app/appFind/getDictTips?code=schoolRun&num=1           校园跑开关\nPOST /app/appFind/getDictTips?code=attendanceRadius&num=1\
    \    签到半径（实测 40 米）\n```\n\n---\n\n## ⚠️ 已知服务端问题\n\n以下为实测发现的服务端行为，复刻客户端时**需要自行规避**：\n\n| 问题 | 影响接口\
    \ |\n|---|---|\n| 空参直接返回 **HTTP 500**（无参数校验） | `/sign/addUserSign`、`/run/site/addApplySelectTime`、`/run/site/getApplyDetail`\
    \ |\n| 异常栈直接返回给客户端 | `/run/physical/getPhysicalTestList`、`/run/site/addSiteApplyRelated` |\n| `POST\
    \ /appUser/resetNewPassWord` **不需旧密码/验证码** | 仅凭 `userId` 即可改密 |\n| `POST /campusNetwork/getOperatorAccountByIDCard`\
    \ **无参即返回宽带账号** | PII 泄露 |\n| 口令明文走 URL query | `/login`、`/appUser/modifyPassword`、`/appUser/resetNewPassWord`\
    \ |\n| 响应键名拼写错误 | `getInternetInfo` 返回 `massage`（应为 message）；`getRecycleTypeList` / `getPhysicalRelatedItemsList`\
    \ 等响应键带 `get` 前缀 |\n| 参数名拼写错误 | `cmsCloumnId`（少一个 n）、`addApplyDenfition` |\n\n---\n\n## \U0001F5A5\
    \ 服务端技术栈\n\n从异常栈泄漏信息得出：\n\n| 组件 | 版本 / 说明 |\n|---|---|\n| 应用服务器 | Apache Tomcat，`/usr/local/tomcat/webapps/ROOT`\
    \ |\n| 框架 | Spring + MyBatis |\n| 连接池 | Alibaba Druid（`maxActive 50`） |\n| 脚手架 | **Guns**（`cn.stylefeng.guns`）\
    \ |\n| 数据库 | MySQL（由 Druid/MyBatis 栈推断） |\n\n⇒ 参数就是普通 query / form 参数，无需按 REST 风格猜测。\n\n---\n\n##\
    \ \U0001F4D6 延伸阅读\n\n- 完整逆向分析文档集：[github.com/better-zslf](https://github.com/better-zslf)\n- API 实测手册：`docs/13-api-live-testing.md`\n\
    - 本规范源码：[github.com/better-zslf/zslf-API-collect](https://github.com/better-zslf/zslf-API-collect)\n\
    \n---\n\n*本文档由自动化逆向分析 + 真实请求实测生成。仅收录接口契约信息，不含任何用户凭据或个人身份数据。*\n"
  contact:
