components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID v4
      description: '**实际是裸 token，不要加 `Bearer ` 前缀。**


        即 `Authorization: <accessToken>`，token 从 `POST /login` 的响应 `data.accessToken` 获取。


        服务端严格校验：无效 token 返回 HTTP 401。无刷新机制，失效需重新登录。'
  schemas:
    Envelope: *id001
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: 学号 / 账号
          example: <your-student-id>
        password:
          type: string
          description: 明文口令
          example: <your-password>
security:
- bearerAuth: []
