paths:
  /login:
    post:
      tags:
      - auth
      summary: 账号密码登录
      description: '登录并获取 `accessToken`。


        **要点**：

        - 口令以**明文**放在 URL query 中（服务端设计如此，非本文档选择）

        - 响应 `data.accessToken` 是 **UUID v4**，后续请求放在 `Authorization` 头（裸值，无 `Bearer`）

        - 响应**没有** `refreshToken` 字段，也没有刷新端点；token 失效只能重新登录

        - `mapWebType` / `mapToken` 是服务端下发的地图配置，客户端应优先用它'
      operationId: post_login
      parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
        description: 学号 / 账号
      - name: password
        in: query
        required: true
        schema:
          type: string
        description: 明文口令
      responses:
        '200':
          description: 业务响应。**注意：HTTP 200 也可能是业务错误**，务必判 `body.code === 200`
          content:
            application/json:
              schema: &id001
                type: object
                required:
                - code
                - success
                properties:
                  code:
                    type: integer
                    description: 业务状态码，`200` = 成功
                    example: 200
                  data:
                    description: 业务数据；**失败时是空字符串 `""`**
                    nullable: true
                  message:
                    type: string
                    description: 中文提示信息
                    example: 获取用户信息成功
                  success:
                    type: boolean
                    description: 与 `code` 语义一致（客户端从不读取）
                    example: true
              examples:
                login_ok:
                  summary: 登录成功
                  value:
                    code: 200
                    data:
                      userInfo:
                        id: <userId>
                        account: <学号>
                        newAccount: ''
                        avatar: ''
                        name: <姓名>
                        nickname: 用户_xxxxxxxx
                        number: ''
                        phone: ''
                        sex: 1
                        birthday: ''
                        email: ''
                        type: 0
                        status: 1
                      deptInfo:
                        sexValue: 男
                        createtime: '2026-08-28 11:14:37'
                        logintime: '2026-10-23 08:21:47'
                        firstlogin: '2026-09-02 07:28:19'
                        sex: 1
                        loginDevice: '-1'
                        type: 0
                        jobtype: 0
                        nickname: 用户_xxxxxxxx
                        name: <姓名>
                        typeValue: 学生
                        id: <userId>
                        schoolName: 电子科技大学中山学院
                        studentNum: <学号>
                        account: <学号>
                        status: 1
                      accessToken: <UUID v4，用于后续请求的 Authorization 头>
                      firstLogin: false
                      mapWebType: '1'
                      mapToken: <服务端下发的地图 key>
                    message: 登录成功
                    success: true
  /appUser/getUserInfo:
    get:
      tags:
      - appUser
      summary: 获取当前用户信息
      description: '获取登录用户的详细资料（院系、学号、身份类型等）。


        返回的字段与登录响应里的 `deptInfo` 完全一致。'
      operationId: get_appUser_getUserInfo
      responses:
        '200':
          description: 业务响应。**注意：HTTP 200 也可能是业务错误**，务必判 `body.code === 200`
          content:
            application/json:
              schema: *id001
              examples:
                userinfo:
                  summary: 当前用户信息
                  value: &id002
                    code: 200
                    data:
                      userInfo:
                        sexValue: 男
                        createtime: '2026-08-28 11:14:37'
                        logintime: '2026-10-23 08:21:47'
                        firstlogin: '2026-09-02 07:28:19'
                        sex: 1
                        loginDevice: '-1'
                        type: 0
                        jobtype: 0
                        nickname: 用户_xxxxxxxx
                        name: <姓名>
                        typeValue: 学生
                        id: <userId>
                        schoolName: 电子科技大学中山学院
                        studentNum: <学号>
                        account: <学号>
                        status: 1
                    message: 获取用户信息成功
                    success: true
        '401':
          description: 未登录 / token 无效。**鉴权失败走 HTTP 401，body 为空**
      security:
      - bearerAuth: []
  /appUser/getUserPhotoURL:
    post:
      tags:
      - appUser
      summary: 获取用户头像
      description: '返回 `attachment.filepath`。用户未上传头像时所有字段为空字符串。


        头像 URL 拼接：`https://zslf.zsc.edu.cn/userfiles/` + `filepath`。'
      operationId: post_appUser_getUserPhotoURL
      responses:
        '200':
          description: 业务响应。**注意：HTTP 200 也可能是业务错误**，务必判 `body.code === 200`
          content:
            application/json:
              schema: *id001
              examples:
                userinfo:
                  summary: 当前用户信息
                  value: *id002
        '401':
          description: 未登录 / token 无效。**鉴权失败走 HTTP 401，body 为空**
      security:
      - bearerAuth: []
  /appUser/checkUserVerification:
    post:
      tags:
      - appUser
      summary: 检查用户身份证
      description: '返回 `{isExistIDCard: bool}`，用于判断用户是否已完成实名认证。'
      operationId: post_appUser_checkUserVerification
      responses:
        '200':
          description: 业务响应。**注意：HTTP 200 也可能是业务错误**，务必判 `body.code === 200`
          content:
            application/json:
              schema: *id001
        '401':
          description: 未登录 / token 无效。**鉴权失败走 HTTP 401，body 为空**
      security:
      - bearerAuth: []
  /appUser/getUserArctileStatis:
    post:
      tags:
      - appUser
      summary: 用户内容统计
      description: 返回 `{collect, comment, history}`，分别是收藏数、评论数、浏览历史数。
      operationId: post_appUser_getUserArctileStatis
      responses:
        '200':
          description: 业务响应。**注意：HTTP 200 也可能是业务错误**，务必判 `body.code === 200`
          content:
            application/json:
              schema: *id001
        '401':
          description: 未登录 / token 无效。**鉴权失败走 HTTP 401，body 为空**
      security:
      - bearerAuth: []
  /appUser/checkPhone:
    post:
      tags:
      - appUser
      summary: 校验手机号（取验证码）
      description: 忘记密码流程第一步。缺 `smsCode` 时返回「请输入正确的验证码!」。
      operationId: post_appUser_checkPhone
      parameters:
      - name: phone
        in: query
        required: true
        schema:
          type: string
        description: 手机号
      - name: smsCode
        in: query
        required: false
        schema:
          type: string
        description: 短信验证码
      responses:
        '200':
          description: 业务响应。**注意：HTTP 200 也可能是业务错误**，务必判 `body.code === 200`
          content:
            application/json:
              schema: *id001
        '401':
          description: 未登录 / token 无效。**鉴权失败走 HTTP 401，body 为空**
      security:
      - bearerAuth: []
  /appUser/modifyPassword:
    post:
      tags:
      - appUser
      summary: 修改密码
      description: '**服务端密码策略**：长度 ≥ 8，且必须同时包含字母、数字、符号。


        历史上存在的 6 位纯数字旧密码仍可登录，但**不能再被设置为新密码**。'
      operationId: post_appUser_modifyPassword
      parameters:
      - name: newPassWord
        in: query
        required: true
        schema:
          type: string
        description: 新密码
      - name: oldPassword
        in: query
        required: true
        schema:
          type: string
        description: 旧密码
      responses:
        '200':
          description: 业务响应。**注意：HTTP 200 也可能是业务错误**，务必判 `body.code === 200`
          content:
            application/json:
              schema: *id001
        '401':
          description: 未登录 / token 无效。**鉴权失败走 HTTP 401，body 为空**
      security:
      - bearerAuth: []
  /appUser/resetNewPassWord:
    post:
      tags:
      - appUser
      summary: 重置密码（无需旧密码）
      description: '⚠️ **该接口不需要旧密码、不需要验证码**，只要 `newPassWord` + `userId` 就能改密。


        bundle 中另有 `PUT` + JSON body 的写法，但**实测服务端不解析 body**，只认 `POST` + query —— 本文档按实测结论编写。'
      operationId: post_appUser_resetNewPassWord
      parameters:
      - name: newPassWord
        in: query
        required: true
        schema:
          type: string
        description: 新密码
      - name: userId
        in: query
        required: true
        schema:
          type: string
        description: 用户 ID
      responses:
        '200':
          description: 业务响应。**注意：HTTP 200 也可能是业务错误**，务必判 `body.code === 200`
          content:
            application/json:
              schema: *id001
        '401':
          description: 未登录 / token 无效。**鉴权失败走 HTTP 401，body 为空**
      security:
      - bearerAuth: []
  /appNotice/unreadNumber:
    post:
      tags:
      - appNotice
      summary: 未读消息数
      description: '角标数字 = `unreadNumber + noticeMutualCount`。


        App 端在页面 `onShow` 时触发，**没有定时轮询**。'
      operationId: post_appNotice_unreadNumber
      responses:
